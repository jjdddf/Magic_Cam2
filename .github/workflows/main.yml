name: Build MagicCam
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicCam-Module
          path: |
            *.apk
            **/*.apk
            *.zip
            **/*.zip
